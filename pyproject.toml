[project]
name = "quota-monitoring"
version = "6.0.0"
description = "Org-wide GCP quota monitoring: daily collection into BigQuery plus a self-hosted dashboard."
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.35",
    "requests>=2.32",
    "google-cloud-bigquery>=3.25",
    "google-cloud-resource-manager>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
qms = "collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --ignore=collector/sources"

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
# "S" is flake8-bandit, reimplemented natively by Ruff. Running it here costs
# nothing measurable and removes any need for a separate Bandit pass, which
# would only report the same findings twice.
extend-select = ["S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Bare asserts are the entire point of a test.
"tests/**" = ["S101"]
# These two modules build BigQuery view and table references by interpolation
# because BigQuery cannot bind an identifier as a query parameter. Every part
# is validated by collector.bqnames first, and all actual *values* in these
# queries are passed as parameters. S608 cannot tell the difference.
"collector/sinks/views.py" = ["S608"]
"dashboard/queries.py" = ["S608"]

