[project]
name = "quota-monitoring"
version = "6.0.0"
description = "Org-wide GCP quota monitoring: daily collection into BigQuery plus a self-hosted dashboard."
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.35",
    "requests>=2.32",
    "google-cloud-bigquery>=3.25",
    "google-cloud-resource-manager>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
qms = "collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --ignore=collector/sources"

[tool.ruff]
line-length = 96
target-version = "py311"
