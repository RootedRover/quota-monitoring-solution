name: CI

# Every commit on main and every pull request. These are the fast, deterministic
# checks; deep AI-assisted scanning lives in codemender.yml.
on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

# Deny by default; each job opts in to the least privilege it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      # Ruff's "S" ruleset is flake8-bandit, so this pass is both style and
      # pattern-level security. Failing here is intentional.
      - name: Lint (includes flake8-bandit security rules)
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      # Audits these workflow files themselves for template injection,
      # over-broad permissions, unpinned actions and credential persistence.
      - name: Run zizmor
        run: uvx zizmor --format sarif . > zizmor.sarif
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Fail on findings
        run: uvx zizmor --format plain .

  iac:
    name: IaC and container config (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Currently a near no-op: the v5 Terraform was deleted and the Cloud Run
      # Dockerfile arrives in phase P4. Wired up now so that IaC is covered the
      # moment it lands, rather than depending on someone remembering.
      - name: Scan Terraform and Dockerfiles
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          cache: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('trivy-config.sarif') != '' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      # Second pass to fail the job. SARIF output and a non-zero exit code
      # cannot be produced by the same invocation.
      - name: Fail on findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          cache: true

  # Single required status check. Without this, adding or renaming a job means
  # editing the branch ruleset, and a job that is skipped registers as pending
  # rather than passing -- which silently blocks merges forever.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, zizmor, iac]
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "all required jobs succeeded"
