name: CodeQL

on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    - cron: "27 4 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # "actions" analyses these workflow files for injection and
        # permission defects -- the supply-chain surface most often missed.
        language: [python, actions]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          # Correct for interpreted languages; replaces the old autobuild step.
          build-mode: none
          # "security-extended" roughly doubles alert volume versus the default
          # suite. Deliberately not "security-and-quality", which is a code
          # quality suite and would bury the security findings.
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
